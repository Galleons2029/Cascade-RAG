[project]
name = "Bank-copilot"
version = "0.1.0"
description = "Build for Enterprise-level RAG System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.9.1",
    "bcrypt>=4.3.0",
    #"bytewax>=0.21.1",
    # "docling>=2.15.1",
    "copilotkit>=0.1.76",
    "dashscope>=1.24.1",
    "deepagents>=0.2.6",
    "fastapi>=0.115.12",
    "fastmcp",
    # "flagembedding>=1.3.5",
    "gradio>=5.31.0",
    "graphiti-core>=0.23.1",
    "httpx[socks]>=0.28.1",
    "ipywidgets>=8.1.8",
    "langchain>=1.0.8",
    "langchain-anthropic>=1.0.3",
    "langchain-community>=0.4.1",
    "langchain-core>=1.1.0",
    "langchain-google-genai>=3.1.0",
    "langchain-openai>=1.0.2",
    "langchain-tavily>=0.2.13",
    "langfuse>=3.2.1",
    "langgraph>=1.0.8",
    "langgraph-api>=0.5.24",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-checkpoint-postgres>=3.0.1",
    "langgraph-cli[inmem]>=0.4.12",
    "langgraph-prebuilt>=1.0.7",
    "langgraph-runtime-inmem>=0.24.1",
    "langgraph-sdk>=0.2.9",
    #"llama-index>=0.12.37",
    "markdownify>=1.2.0",
    "markitdown>=0.1.2",
    "modelscope>=1.29.1",
    "notebook>=7.4.3",
    "openevals>=0.1.0",
    "pika>=1.3.2",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "pymilvus>=2.5.10",
    "pymongo>=4.13.0",
    "pytest>=9.0.1",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "qdrant-client>=1.14.2",
    "ragas>=0.3.0",
    "redis>=6.4.0",
    "sqlmodel>=0.0.24",
    "structlog>=25.3.0",
    "tavily-python>=0.5.0",
    # "unstructured>=0.17.2",
    "timescaledb>=0.0.4",
    "transformers>=4.54.1",
]

[tool.setuptools]
packages = ["app"]

[tool.uv]
override-dependencies = [
    "nbconvert>=7.17.0",
    "protobuf>=6.33.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.12.9",
]

[tool.ruff]
# Set the maximum line length to 150.
line-length = 150

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]
